<h2 mat-dialog-title class="dialog-title">{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button (click)="onCancel()" class="btn-cancel">Cancel</button>
  <button (click)="onConfirm()" class="btn-confirm">
    Confirm
  </button>
</mat-dialog-actions>
